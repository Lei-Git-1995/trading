# 短线选股策略预设配置
#
# 使用方法：
#   py -3.11 -m stock_selector.main --preset aggressive
#   py -3.11 -m stock_selector.main --preset conservative
#
# 说明：命令行参数优先级高于预设配置

presets:
  # 默认策略：适中的选股标准
  default:
    turnover: 3.0
    change: [-2, 8]
    volume: 0.8
    sector: 30
    check_outer_inner: true
    check_kdj: false
    check_rsi: false
    filter_cyb: false
    filter_kcb: false

  # 激进策略：捕捉强势股
  # 特点：高换手、大涨幅、强放量
  aggressive:
    turnover: 6.0
    change: [1, 9.5]
    volume: 1.2
    sector: 25
    check_outer_inner: true
    check_kdj: true
    check_rsi: false  # 允许超买，捕捉强势
    filter_cyb: false
    filter_kcb: false

  # 保守策略：稳健标的
  # 特点：低换手、小涨幅、适度放量
  conservative:
    turnover: 2.0
    change: [-3, 6]
    volume: 0.7
    sector: 40
    check_outer_inner: true
    check_kdj: false
    check_rsi: false
    filter_cyb: true   # 过滤创业板
    filter_kcb: true   # 过滤科创板

  # 低吸策略：寻找反弹机会
  # 特点：允许小跌、低位反弹
  dip_buying:
    turnover: 2.0
    change: [-5, 5]
    volume: 0.8
    sector: 30
    check_outer_inner: true
    check_kdj: false
    check_rsi: false
    filter_cyb: false
    filter_kcb: false

  # 突破策略：捕捉放量突破
  # 特点：大幅放量、中等涨幅
  breakout:
    turnover: 5.0
    change: [0, 8]
    volume: 1.2
    sector: 25
    check_outer_inner: true
    check_kdj: false   # 不限制KDJ
    check_rsi: false   # 不限制RSI
    filter_cyb: false
    filter_kcb: false

  # 主板稳健策略：只选主板股
  # 特点：过滤创业板和科创板
  mainboard_only:
    turnover: 2.0
    change: [-1, 7]
    volume: 0.8
    sector: 30
    check_outer_inner: true
    check_kdj: false
    check_rsi: false
    filter_cyb: true
    filter_kcb: true
    mainboard_only: true  # 只选主板

  # 题材轮动策略：捕捉板块轮动机会
  sector_rotation:
    turnover: 5.0
    change: [1, 9]
    volume: 1.2
    sector: 8                # 每板块只取前8
    check_outer_inner: true
    check_kdj: true
    check_rsi: false
    filter_cyb: false
    filter_kcb: false
    mainboard_only: false

  # 价值回归策略：找到超跌后开始反弹的股票
  value_return:
    turnover: 2.0
    change: [-10, 5]         # 允许较大跌幅及反弹
    volume: 0.8              # 量能不明显萎缩即可
    sector: 50
    check_outer_inner: true  # 资金开始流入
    check_kdj: true          # KDJ低位
    check_rsi: true          # RSI低位
    filter_cyb: false
    filter_kcb: false
    mainboard_only: false    # 扩大候选范围

  # 打板策略：找到接近涨停的强势股
  limit_up_chase:
    turnover: 10.0           # 适度换手
    change: [5, 10]          # 涨幅较强即可
    volume: 1.5              # 适度放量
    sector: 15               # 每板块放宽数量
    check_outer_inner: true
    check_kdj: false         # 允许超买
    check_rsi: false
    filter_cyb: false
    filter_kcb: false
    mainboard_only: false

  # === 资金流向策略 ===

  # 大单流入500万
  big_order_500w:
    strategy_type: big_order_inflow
    big_order_threshold: 100
    min_net_inflow: 100
    turnover: 3.0
    change: [-5, 10]

  # 大单流入1000万
  big_order_1000w:
    strategy_type: big_order_inflow
    big_order_threshold: 300
    min_net_inflow: 300
    turnover: 4.0
    change: [-5, 10]

  # 大单流入5000万(超大资金)
  big_order_5000w:
    strategy_type: big_order_inflow
    big_order_threshold: 1000
    min_net_inflow: 1000
    turnover: 5.0
    change: [-3, 10]

  # 资金抢筹
  capital_grab:
    strategy_type: capital_grab
    min_net_inflow: 300       # 最小主力净流入300万
    min_main_ratio: 2.0       # 主力净占比>2%
    turnover: 3.0
    change: [-4, 10]

  # 猛烈打压(寻找洗盘机会)
  violent_suppress:
    strategy_type: violent_suppress
    min_net_outflow: 300      # 最小净流出300万
    max_change_pct: -1.0      # 最大跌幅-1%
    turnover: 3.0
