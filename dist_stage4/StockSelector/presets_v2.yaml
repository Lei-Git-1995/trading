# 策略配置 v2.0 - 多维度评分架构
#
# 使用方法：
#   py -3.11 -m stock_selector.main --preset-v2 ultra_short
#
# 架构说明：
#   filters:  第一层 - 基础过滤（硬条件，不通过直接淘汰）
#   signals:  第二层 - 信号评分（多维度打分，加权求和）
#   risk:     第三层 - 风险控制（识别风险因素，扣分或警告）
#   output:   第四层 - 输出控制（排序、数量限制）

strategies:
  # ============================================================
  # 超短线启动策略 (1-2日持仓)
  #
  # 核心思想：
  #   不追高，寻找刚刚启动、强于板块、有资金流入、
  #   技术位置合理的短线机会。
  #
  # 适合场景：
  #   - 盘后选股，次日冲高卖出
  #   - 1-2个交易日持仓
  #   - 追求短期价差，不追涨停
  # ============================================================
  ultra_short:
    name: "超短线启动策略"
    description: "1-2日强势启动，不追高，寻找启动点"

    # --------------------------------------------------------
    # 第一层：基础过滤（硬条件）
    # --------------------------------------------------------
    filters:
      # 流动性要求
      liquidity:
        turnover_min: 3.0         # 换手率至少3%
        turnover_max: 45.0        # 换手率不超45%
        amount_min: 0.2           # 有成交额字段时至少0.2亿
        volume_ratio_min: 0.8     # 量比至少0.8倍

      # 价格要求
      price:
        change_min: -1.0           # 涨跌幅至少-1%
        change_max: 10.0           # 涨幅不超10%
        price_min: 1.5             # 价格至少1.5元
        price_max: 300.0          # 价格不超300元

      # 板块要求
      board:
        allow_cyb: true           # 允许创业板
        allow_kcb: true           # 允许科创板
        allow_st: false           # 不选ST
        min_list_days: 30         # 至少上市30天

    # --------------------------------------------------------
    # 第二层：信号评分（满分100分）
    # --------------------------------------------------------
    signals:
      # 动能信号 (25分)
      momentum:
        weight: 25
        metrics:
          - name: relative_strength
            min: 0.0              # 降低要求（板块数据不稳定）
            optimal: [0.0, 5.0]   # 最佳区间：0-5%
            score: 10

          - name: recent_change
            days: 5
            min: -10
            max: 30               # 5日涨幅不超30%
            optimal: [3, 18]      # 最佳区间：3-18%
            score: 10

          - name: consecutive_up_days
            max: 4                # 连续上涨不超4天
            score: 5

      # 技术信号 (20分)
      technical:
        weight: 20
        metrics:
          - name: ma_position
            min: -6               # 距MA20不超-6%
            max: 20               # 距MA20不超+20%
            optimal: [0, 10]      # 最佳区间：在MA20上方0-10%
            score: 8

          - name: breakout
            enabled: true
            lookback: 20          # 突破20日高点
            score: 12

      # 资金信号 (25分)
      capital_flow:
        weight: 25
        metrics:
          - name: main_force_flow
            min: 0                # 降低要求（腾讯数据源资金流向不稳定）
            optimal: [0, 5000]    # 有资金流入即佳
            score: 15

          - name: outer_ratio
            min: 0.50             # 外盘占比至少50%
            optimal: [0.50, 0.80] # 最佳区间：50-80%
            score: 10

      # 量价信号 (15分)
      volume:
        weight: 15
        metrics:
          - name: volume_ratio
            min: 1.2
            optimal: [1.2, 4.0]   # 最佳区间：1.2-4倍
            score: 15

      # 形态信号 (15分)
      pattern:
        weight: 15
        metrics:
          - name: kdj_k
            max: 90               # KDJ不超买
            optimal: [20, 75]     # 最佳区间：20-75
            score: 8

          - name: platform_breakout
            enabled: true
            score: 7

    # --------------------------------------------------------
    # 第三层：风险控制（扣分）
    # --------------------------------------------------------
    risk:
      deduct:
        - name: consecutive_up_days
          threshold: 7
          penalty: -10           # 连续上涨7天扣10分

        - name: ma_position
          threshold: 30          # 距MA20超30%
          penalty: -8            # 扣8分

        - name: recent_change
          days: 3
          threshold: 40          # 3日涨超40%
          penalty: -12           # 扣12分（可能是短线追高）

        - name: turnover
          threshold: 50          # 换手率超50%
          penalty: -5            # 扣5分（分歧过大）

    # --------------------------------------------------------
    # 第四层：输出控制
    # --------------------------------------------------------
    output:
      min_score: 25              # 放宽准入门槛，保留评分排序
      top_n: 80                  # 最多80只
      group_by_sector: true      # 按板块分组
      max_per_sector: 8          # 每板块最多8只
      sort_by: score             # 按得分排序


  # ============================================================
  # 启动策略（偏保守版本）
  #
  # 与 ultra_short 的区别：
  #   - 更关注技术位置（MA20支撑）
  #   - 更严格的涨幅限制
  #   - 更看重资金持续流入
  # ============================================================
  momentum_start:
    name: "启动策略"
    description: "寻找刚刚启动、技术位置好的机会"

    filters:
      liquidity:
        turnover_min: 2.5
        turnover_max: 40.0
        amount_min: 0.2
        volume_ratio_min: 0.8

      price:
        change_min: -2.0
        change_max: 10.0          # 放宽涨幅区间
        price_min: 1.5
        price_max: 300.0

      board:
        allow_cyb: true
        allow_kcb: true          # 允许科创板
        allow_st: false
        min_list_days: 30

    signals:
      momentum:
        weight: 20
        metrics:
          - name: relative_strength
            min: 0.0
            optimal: [0.0, 3.0]
            score: 10

          - name: recent_change
            days: 5
            min: -8
            max: 25
            optimal: [2, 15]
            score: 10

      technical:
        weight: 30               # 更看重技术位置
        metrics:
          - name: ma_position
            min: -5
            max: 15
            optimal: [0, 8]      # 在MA20附近启动
            score: 15

          - name: breakout
            enabled: true
            lookback: 15
            score: 15

      capital_flow:
        weight: 25
        metrics:
          - name: main_force_flow
            min: 0
            optimal: [0, 5000]
            score: 15

          - name: outer_ratio
            min: 0.50
            optimal: [0.50, 0.80]
            score: 10

      volume:
        weight: 15
        metrics:
          - name: volume_ratio
            min: 1.2
            optimal: [1.2, 3.5]
            score: 15

      pattern:
        weight: 10
        metrics:
          - name: kdj_k
            max: 88
            optimal: [25, 70]
            score: 5

          - name: rsi6
            max: 80
            optimal: [35, 70]
            score: 5

    risk:
      deduct:
        - name: consecutive_up_days
          threshold: 6
          penalty: -12

        - name: ma_position
          threshold: 25
          penalty: -10

        - name: recent_change
          days: 3
          threshold: 35
          penalty: -10

    output:
      min_score: 25              # 降低准入门槛
      top_n: 60
      group_by_sector: true
      max_per_sector: 6
      sort_by: score


  # ============================================================
  # 弱转强策略
  #
  # 寻找：
  #   昨日弱势/分歧 → 今日放量转强
  # ============================================================
  weak_to_strong:
    name: "弱转强策略"
    description: "寻找前一日弱势、今日转强的机会"

    filters:
      liquidity:
        turnover_min: 2.0
        amount_min: 0.2
        volume_ratio_min: 0.8

      price:
        change_min: -2.0          # 放宽到小幅下跌，捕捉弱转强前的分歧
        change_max: 12.0
        price_min: 1.5

      board:
        allow_cyb: true
        allow_kcb: true
        allow_st: false
        min_list_days: 30

    signals:
      momentum:
        weight: 30               # 最看重动能变化
        metrics:
          - name: momentum_acceleration
            enabled: true        # 动能加速
            score: 15

          - name: relative_strength
            min: 0.0
            score: 15

      technical:
        weight: 15
        metrics:
          - name: ma_position
            min: -8
            max: 20
            score: 15

      capital_flow:
        weight: 30               # 资金流入是关键
        metrics:
          - name: main_force_flow
            min: 0
            score: 20

          - name: outer_ratio
            min: 0.45
            score: 10

      volume:
        weight: 25               # 成交量突然放大
        metrics:
          - name: volume_expansion
            enabled: true
            threshold: 0.8
            score: 25

    risk:
      deduct:
        - name: consecutive_up_days
          threshold: 5           # 已经连续上涨的不算"弱转强"
          penalty: -15

    output:
      min_score: 20
      top_n: 60
      group_by_sector: true
      max_per_sector: 6
      sort_by: score
