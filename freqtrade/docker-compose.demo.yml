services:
  freqtrade-demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
      args:
        BRANCH: ${OKX_DEMO_BRANCH:-main}
    image: freqtrade-okx-demo:2026.9
    container_name: freqtrade-okx-demo
    restart: unless-stopped
    env_file:
      - .env.demo
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./demo_guard.py:/freqtrade/demo_guard.py:ro
    entrypoint: ["python", "/freqtrade/demo_guard.py"]
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

