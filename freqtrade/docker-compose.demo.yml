services:
  freqtrade-demo:
    image: freqtradeorg/freqtrade:2026.9
    container_name: freqtrade-okx-demo
    restart: unless-stopped
    env_file:
      - .env.demo
    volumes:
      - ./user_data:/freqtrade/user_data
      - ./demo_guard.py:/freqtrade/demo_guard.py:ro
    entrypoint: ["python", "/freqtrade/demo_guard.py"]

